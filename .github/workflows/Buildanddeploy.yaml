name: Build and Deploy
on: [push]
jobs:
  Build:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.create_tag.outputs.image_tag }}
    steps:
      - name: Code Checkout
        uses: actions/checkout@v6

      - name: Generate github Image Tags
        id : create_tag
        shell: powershell
        run: |
          $tag = $env:GITHUB_SHA
          echo "image_tag=$tag" >> $env:GITHUB_OUTPUT
      - name: Login to dockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: build the image
        shell: powershell
        run: |
          docker build -t prateekhanda/pythonapp_image:${{ steps.create_tag.outputs.image_tag }}
      - name: Push Image
        shell: powershell
        run: |
          docker push prateekhanda/pythonapp_image:${{ steps.create_tag.outputs.image_tag }}